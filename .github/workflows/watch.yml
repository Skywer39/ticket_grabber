name: watch

# Polls the cinema and pushes alerts to Discord, so monitoring keeps running while
# you are away from your own server.
#
# Each run is a ~52-minute polling *session*, not a single poll. That shape is
# deliberate: measured dispatch gaps for a `*/10` cron on this repository were 85, 75,
# 60 and 65 minutes, because GitHub heavily deprioritises scheduled workflows. Putting
# the loop inside the job means GitHub's throttling only decides when a session
# starts, while the cadence within it is the poller's own — 45s during the configured
# hot window, 15 min overnight.
#
# Requires a public repository: private repos meter Actions minutes (2,000/month free)
# and hour-long jobs would exhaust that in a couple of days. Public repos are unmetered.
#
# Setup: add a repository secret TG_DISCORD_WEBHOOK_URL (Settings -> Secrets and
# variables -> Actions). Nothing else is required.

on:
  schedule:
    # Hourly. A denser cron would only queue runs behind the concurrency group,
    # since each run already occupies most of the hour.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Discard saved state and re-seed the baseline"
        type: boolean
        default: false

# Runs share one SQLite file; overlapping them would corrupt it.
concurrency:
  group: ticket-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Longer than the 52-minute poll cap below, so the cap fires first and the state
    # save still runs. GitHub would kill the job outright at its own limit.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install --quiet .

      - name: Restore previous state
        if: ${{ !inputs.reset_state }}
        run: |
          mkdir -p data
          if ! git fetch --depth 1 origin state 2>/dev/null; then
            echo "no state branch — this run will seed the baseline silently"
            exit 0
          fi
          # Extract to a temp file first: redirecting straight onto data/tg.db would
          # leave an empty (but valid) database behind if the extraction failed,
          # silently discarding the baseline and re-seeding.
          if git show FETCH_HEAD:data/tg.db > /tmp/tg.db 2>/dev/null && [ -s /tmp/tg.db ]; then
            mv /tmp/tg.db data/tg.db
            echo "restored $(stat -c%s data/tg.db) bytes of state"
          else
            rm -f /tmp/tg.db
            echo "state branch carries no usable database — re-seeding"
          fi

      - name: Poll
        env:
          TG_DISCORD_WEBHOOK_URL: ${{ secrets.TG_DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$TG_DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::TG_DISCORD_WEBHOOK_URL is not set — alerts will be" \
                 "recorded but not delivered"
          fi
          cp config.example.yaml config.yaml

          # `tg run` loops until stopped, so cap it by wall clock. `timeout` exits 124
          # when the cap fires, which is the normal outcome here and must not be
          # treated as failure — otherwise the state save would be skipped and the
          # whole session's work lost.
          timeout --signal=INT 52m tg run || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ] && [ "${status:-0}" -ne 130 ]; then
            echo "::error::poller exited with status ${status}"
            exit "${status}"
          fi
          echo "polling session finished (exit ${status:-0})"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Poll result"
            echo '```'
            tg status --limit 8 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        # always(), not success(): a session cut short still holds a valid database
        # representing up to an hour of polling, and discarding it would make the
        # next run re-seed and stay silent through a real change.
        if: always()
        run: |
          if [ ! -s data/tg.db ]; then
            echo "::warning::no database to save — skipping"
            exit 0
          fi

          # Checkpoint the WAL so the committed file is self-contained.
          python -c "import sqlite3; c=sqlite3.connect('data/tg.db'); \
            c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An orphan branch rewritten each run keeps exactly one commit, so a
          # database committed every 10 minutes never grows the repository.
          git checkout --orphan state-tmp
          # Tolerate an already-empty index; the step runs under `bash -e` and an
          # unstaged tree would otherwise abort the save.
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f data/tg.db
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f -q origin state-tmp:state
          echo "saved $(stat -c%s data/tg.db) bytes of state"
