name: watch

# Polls the cinema and pushes alerts to Discord, so monitoring keeps running while
# you are away from your own server.
#
# Each run is a 5h40m polling *session*, not a single poll, because GitHub's scheduler
# cannot be relied on for cadence. Measured on this repository: a `*/10` cron dispatched
# at gaps of 85, 75, 60 and 65 minutes; an hourly cron dispatched at gaps of 205 and 266
# minutes. Short sessions therefore left the site unwatched ~75% of the time.
#
# Sizing the session just under GitHub's 6-hour job ceiling fixes that. A dispatch now
# almost always lands while a session is still running, so it queues behind the
# concurrency group and starts the moment the current one ends. The cron is no longer
# the cadence — it is what keeps the chain unbroken. Cadence inside a session is the
# poller's own: 45s during the configured hot window, 15 min overnight.
#
# Requires a public repository. Private repos meter Actions minutes (2,000/month free),
# which a continuously running job would exhaust in under two days. Public repos are
# unmetered.
#
# Trade-off accepted: state is committed only at session end, so an abrupt runner failure
# loses up to ~5.7h of accumulated state. The blast radius is bounded — the next session
# re-seeds the baseline and stays silent for one cycle — and that is cheaper than
# fragmenting coverage into short sessions.
#
# Setup: add a repository secret TG_DISCORD_WEBHOOK_URL (Settings -> Secrets and
# variables -> Actions). Nothing else is required.

on:
  schedule:
    # A dispatch only has to land inside the running session and queue up behind it, so
    # for cadence one an hour would do — only one run can ever be pending, and the extra
    # ticks collapse into that same slot.
    #
    # The density is for the broken case. When no session is running, every tick that
    # fails costs the full interval in unwatched time, and ticks do fail: GitHub
    # declined to allocate a hosted runner for two consecutive runs during the Actions
    # outage of 2026-08-06 ("The job was not acquired by Runner of type hosted"), and
    # the scheduler itself skipped hourly ticks by 205 and 266 minutes under load. More
    # attempts is the only lever there is; at */15 a lost hour costs 15 minutes.
    #
    # Costs 4x the workflow-failure emails while Actions is down, which is the price of
    # the shorter hole. Drop to */30 if that grates.
    - cron: "*/15 * * * *"

  # Deploys. Without this a merge waits for the running session to time out, which is
  # up to 5h40m — and that is not theoretical: two fixes sat undeployed for a day while
  # a session started before them kept alerting on the old rules, and every queued run
  # was evicted before it could start (see `concurrency` below).
  #
  # Scoped to the default branch on purpose. The "Save state" step below pushes to the
  # `state` branch at the end of every session, so an unscoped trigger would make each
  # session's last act start another one, forever.
  push:
    branches: [claude/ticket-monitoring-system-z3zk34]

  workflow_dispatch:
    inputs:
      reset_state:
        description: "Discard saved state and re-seed the baseline"
        type: boolean
        default: false
      test_notify:
        description: "Send a test alert before polling, to prove the webhook works"
        type: boolean
        default: false

# Runs share one SQLite file; overlapping them would corrupt it.
#
# A scheduled run must never cancel the session in progress — that is the whole abutting
# design, where a dispatch lands mid-session and starts the moment the current one ends.
#
# A push must, because it is a deploy. Note what the group does *not* do: it is not a
# queue. GitHub keeps one running job and at most one pending job, and a newly queued run
# evicts the pending one rather than lining up behind it. So without pre-emption a merge
# is not merely delayed, it is repeatedly thrown away — measured on this repo, three
# consecutive new-code runs were cancelled while a stale session held the slot.
concurrency:
  group: ticket-watch
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Longer than the 340-minute poll cap below, so the cap fires first and the state
    # save still runs; and under GitHub's own 6-hour ceiling, which would kill the job
    # outright and lose the session's work.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install --quiet .

      - name: Restore previous state
        if: ${{ !inputs.reset_state }}
        run: |
          mkdir -p data
          if ! git fetch --depth 1 origin state 2>/dev/null; then
            echo "no state branch — this run will seed the baseline silently"
            exit 0
          fi
          # Extract to a temp file first: redirecting straight onto data/tg.db would
          # leave an empty (but valid) database behind if the extraction failed,
          # silently discarding the baseline and re-seeding.
          if git show FETCH_HEAD:data/tg.db > /tmp/tg.db 2>/dev/null && [ -s /tmp/tg.db ]; then
            mv /tmp/tg.db data/tg.db
            echo "restored $(stat -c%s data/tg.db) bytes of state"
          else
            rm -f /tmp/tg.db
            echo "state branch carries no usable database — re-seeding"
          fi

      - name: Poll
        env:
          TG_DISCORD_WEBHOOK_URL: ${{ secrets.TG_DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$TG_DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::TG_DISCORD_WEBHOOK_URL is not set — alerts will be" \
                 "recorded but not delivered"
          fi
          cp config.example.yaml config.yaml

          # Put channel wiring on the run summary page. A 5h40m session's log is not
          # somewhere anyone scrolls, and a silently unwired channel is the failure
          # most likely to go unnoticed.
          #
          # The commit is here for the same reason. A session outlives several merges, so
          # "is my change live yet?" is a real question, and answering it used to mean
          # reading run metadata in the Actions API.
          {
            echo "### Session"
            echo "Polling \`${GITHUB_SHA:0:7}\` — started $(date -u '+%F %T UTC'), \
            triggered by \`${GITHUB_EVENT_NAME}\`."
            echo
            echo "### Channels"
            echo '```'
            tg status --limit 1 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | head -4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.test_notify }}" = "true" ]; then
            echo "sending test alert…"
            tg notify test discord
          fi

          # `tg run` loops until stopped, so cap it by wall clock. `timeout` exits 124
          # when the cap fires, which is the normal outcome here and must not be
          # treated as failure — otherwise the state save would be skipped and the
          # whole session's work lost.
          timeout --signal=INT 340m tg run || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ] && [ "${status:-0}" -ne 130 ]; then
            echo "::error::poller exited with status ${status}"
            exit "${status}"
          fi
          echo "polling session finished (exit ${status:-0})"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Poll result"
            echo '```'
            tg status --limit 8 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        # always(), not success(): a session cut short still holds a valid database
        # representing up to an hour of polling, and discarding it would make the
        # next run re-seed and stay silent through a real change.
        if: always()
        run: |
          if [ ! -s data/tg.db ]; then
            echo "::warning::no database to save — skipping"
            exit 0
          fi

          # Checkpoint the WAL so the committed file is self-contained.
          python -c "import sqlite3; c=sqlite3.connect('data/tg.db'); \
            c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An orphan branch rewritten each run keeps exactly one commit, so a
          # database committed every 10 minutes never grows the repository.
          git checkout --orphan state-tmp
          # Tolerate an already-empty index; the step runs under `bash -e` and an
          # unstaged tree would otherwise abort the save.
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f data/tg.db
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f -q origin state-tmp:state
          echo "saved $(stat -c%s data/tg.db) bytes of state"
