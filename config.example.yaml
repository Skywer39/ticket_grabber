# Copy to config.yaml and edit. Secrets live in .env, not here.

database_url: "sqlite:///data/tg.db"

http:
  user_agent: "ticket-grabber/0.1 (self-hosted availability monitor)"
  timeout_seconds: 25
  requests_per_minute: 30      # per host, token-bucketed
  max_retries: 3
  respect_robots: true

poll:
  baseline_seconds: 900        # 15 min normally
  hot_seconds: 45              # inside a hot window
  jitter_ratio: 0.15
  max_concurrency: 4
  # Say so on the alert channels when a session resumes after a hole this long — a
  # CI outage stops the poller silently, and the channel you watch should know. 0 off.
  gap_alert_minutes: 90
  # Report a source that has stopped returning data, after this many polls. 0 off.
  #
  # An adapter that raises is obvious. One that keeps answering 200 while returning no
  # rows is not — from the alert channel it looks exactly like a quiet week, which is
  # precisely how the release this project exists to catch got missed in the first place.
  # Says so once per episode and goes quiet again when the source recovers.
  health_alert_after: 3
  # Wait this long and look again before saying seats freed up. 0 disables.
  #
  # availabilityRatio excludes seats sitting in an open checkout, so on a near-sold-out
  # house most of its movement is a cart expiring and being re-taken, not a cancellation.
  # One IMAX screening was measured going 5 -> 7 -> 5 seats inside four minutes; the
  # alert in between was true and still sent someone to a full seat map. A block that
  # really came back lasts tens of minutes and survives the second look.
  confirm_seconds: 90
  hot_windows:
    # Every day, not just the announced one. The whole reason this exists is that the
    # cinema published early, so treating the announced weekday as reliable would
    # rebuild the original bug. ~12 requests/min against a 30/min budget.
    # Overnight drops back to baseline: publishing at 04:00 is rare enough to accept.
    - name: "program drop watch"
      start: "06:00"
      end: "23:59"

# Tier 2 — exact seat identities, read from the booking flow with a real browser.
#
# Off by default, and honestly: the booking host (tickets.cinemacity.cz) sits behind
# Cloudflare bot management and returned a hard block page to an automated session
# during development. Turn it on only if you are running from your own machine with a
# browser profile you logged in with yourself. If it gets blocked it disables itself
# and says so; tier-1 availability alerting keeps working regardless.
#
# Verify the selectors on your own machine first:
#     tg seatmap probe cinemacity_cz:<screening-id>
seatmap:
  enabled: false
  headless: true
  min_interval_seconds: 300      # never re-read the same screening more often
  backoff_after_block_seconds: 21600
  browser_profile_dir: "data/browser-profile"
  # browser_args: ["--ssl-version-max=tls1.2"]   # only behind a TLS-terminating proxy
  # selectors:                    # override if the site moves its markup
  #   root: "[class*=choose-seats]"
  #   seat: "[data-seat]"

# Checkout assistance. Never buys anything, never solves a human check.
#
#   open  — hand the deep link to your real desktop browser (default, reliable)
#   drive — additionally steer a Playwright browser using your own profile to the
#           seat picker and pre-select matching seats (best-effort; may be blocked)
assist:
  enabled: false
  mode: open
  stop_before_payment: true
  browser:
    headless: false
    browser_profile_dir: "data/browser-profile"

sources:
  cinemacity_cz:
    adapter: cinemacity
    base_url: "https://www.cinemacity.cz"
    options:
      locale: "cz"
      lang: "cs_CZ"
      tenant_id: 10101         # set null to re-derive from the site's JS bundle at startup
      cinemas: ["1052"]        # 1052 = Praha Flora (has the IMAX VOLVO 70mm screen)
      days_ahead: 60

  o2arena_cz:
    adapter: o2arena
    base_url: "https://www.o2arena.cz"
    options:
      # /wp-json/universum/v1/events with stage 3 is the smaller hall next door, if you
      # ever want it. It is a second source block, not a second option here.
      endpoint: "/wp-json/arena/v1/events"
      stage: 2
      venue_name: "O2 arena"
      city: "Praha"
      # The feed publishes its whole programme in one response — measured out to Feb
      # 2028 — and the scheduler treats everything inside days_ahead as covered. Set it
      # wide enough to hold the entire published programme, or a show beyond the edge
      # gets re-announced every time the window rolls over it.
      days_ahead: 800
      # Poll at most twice an hour, whatever the global cadence says.
      #
      # This is one ~837 KB document with no ETag, no Last-Modified, `Cache-Control:
      # no-store` and no gzip, so every poll pays for the whole thing and a conditional
      # GET buys nothing. At the 45s hot cadence that is over a gigabyte a day against a
      # programme that changes about weekly. The hot window exists for a cinema that
      # publishes without warning; an arena announcing a tour six months out does not
      # need it, and hammering the site for it would be rude to no purpose.
      min_interval_seconds: 1800

profiles:
  flora_imax:
    venue: "Praha Flora"
    auditorium_regex: "(?i)imax"
    rows: [8, 14]
    seat_range: [10, 20]
    avoid_rows: [1, 2, 3]

watches:
  # --- Praha Flora, the IMAX hall ------------------------------------------
  #
  # These two used to be one watch scoped to a single film — "Odyssea IMAX 70mm" — which
  # is what the project was built for. That run is over, and a watch named after one
  # title only ever catches the release you already knew about. Both rules below are
  # keyed on the auditorium instead, so the next thing to sell out is caught the same way
  # this one would have been.
  #
  # Keyed on the hall rather than on `formats: [FILM_70MM]` deliberately. The hall also
  # hosts one-off events — concert films, anniversary screenings — that run in IMAX
  # without carrying the 70-mm attribute, and a format filter drops them silently.
  #
  # They are two watches rather than one because their cooldowns want to differ: an
  # announcement is worth hearing once an hour at most, while a block of seats coming
  # back is worth hearing about promptly or not at all.
  - name: "Anything new in the IMAX hall"
    source: cinemacity_cz
    match:
      auditorium_regex: "(?i)imax"
      cinemas: ["1052"]
    trigger:
      on: [NEW_SCREENING]
    notify: [discord]
    cooldown: 1h

  - name: "Seats freed up in the IMAX hall"
    source: cinemacity_cz
    match:
      auditorium_regex: "(?i)imax"
      cinemas: ["1052"]
    trigger:
      # SEAT_FREED is deliberately absent: it is a tier-2 change type and cannot fire
      # while `seatmap.enabled` is false. Listing it only implies a filter that is not
      # running.
      on: [AVAILABILITY_RISE]
      # Measured in seats above this screening's own resting level, not in ratio points.
      #
      # Flora's IMAX is 385 seats and sits at exactly 6 free on most sold-out dates —
      # a structural floor (wheelchair spaces and their companions), not stock you can
      # buy. Against that floor the constant background movement is ±2 seats as carts
      # are held and time out, which produced ~12 alerts a day that were all gone by
      # the time anyone tapped the link. Four seats above the floor means a real block
      # came back, most likely a cancelled group booking.
      min_seats_above_floor: 4
      # And only while the house is still essentially sold out; once a screening has
      # plenty free, seats coming and going is not news.
      max_availability: 0.10
    notify: [discord]
    cooldown: 10m

  # The cheapest and earliest signal there is: one request says which dates have
  # anything on sale, and a date appearing there means a program was published —
  # before any showtime detail has been fetched.
  #
  # Deliberately unfiltered: a new date carries no film, hall or format, so
  # `auditorium_regex` here would not narrow it, it would just be ignored (config load
  # warns if you add one). The IMAX watches above are what filter; this is the heads-up
  # that the next week exists at all.
  - name: "New dates published at Flora"
    source: cinemacity_cz
    trigger:
      on: [NEW_DATE]
    notify: [discord]
    cooldown: 6h

  # --- O2 arena Praha -------------------------------------------------------
  #
  # A different shape of problem from the cinema. Nothing here sells out between one
  # poll and the next; what matters is hearing that a tour is coming, and then hearing
  # the moment it can actually be bought — the feed announces months before it sells.
  #
  # `kinds: [CONCERT]` is the music filter. The arena's programme mixes Hudba, Sport
  # (mostly HC Sparta league fixtures, which recur all season) and family shows; without
  # this every home game would be an alert. Drop the line to watch everything.
  #
  # Note what is *not* here: there is no sold-out or availability alerting for this
  # source and there cannot be. The feed publishes no ratio and no seat counts, and its
  # `isSoldout` flag was null on all 64 performances observed — the field exists and is
  # never populated. Adding SOLD_OUT or AVAILABILITY_RISE below would look like coverage
  # and deliver silence.
  - name: "New show announced at O2 arena"
    source: o2arena_cz
    match:
      kinds: [CONCERT]
    trigger:
      on: [NEW_SCREENING]
    notify: [discord]
    # A tour announcement is not time-critical and often lands as several dates at once;
    # the digest threshold below turns a multi-night run into one message.
    cooldown: 6h

  - name: "Tickets on sale at O2 arena"
    source: o2arena_cz
    match:
      kinds: [CONCERT]
    trigger:
      # Fires when a performance stops being "announced" and becomes buyable, which the
      # adapter derives from the feed's own Selling_since. This is the one moment for a
      # popular show where minutes matter — and the reason min_interval_seconds on the
      # source is 30 minutes rather than several hours.
      on: [ON_SALE]
    notify: [discord]
    cooldown: 1h
