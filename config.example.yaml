# Copy to config.yaml and edit. Secrets live in .env, not here.

database_url: "sqlite:///data/tg.db"

http:
  user_agent: "ticket-grabber/0.1 (self-hosted availability monitor)"
  timeout_seconds: 25
  requests_per_minute: 30      # per host, token-bucketed
  max_retries: 3
  respect_robots: true

poll:
  baseline_seconds: 900        # 15 min normally
  hot_seconds: 45              # inside a hot window
  jitter_ratio: 0.15
  max_concurrency: 4
  hot_windows:
    # Cinema City publishes its new week early sometimes — that is exactly what burned us.
    # Poll hard around the expected drop instead of trusting the announced day.
    - name: "weekly program drop"
      weekdays: [mon, tue, wed]
      start: "06:00"
      end: "23:59"

# Tier 2 — exact seat identities, read from the booking flow with a real browser.
#
# Off by default, and honestly: the booking host (tickets.cinemacity.cz) sits behind
# Cloudflare bot management and returned a hard block page to an automated session
# during development. Turn it on only if you are running from your own machine with a
# browser profile you logged in with yourself. If it gets blocked it disables itself
# and says so; tier-1 availability alerting keeps working regardless.
#
# Verify the selectors on your own machine first:
#     tg seatmap probe cinemacity_cz:<screening-id>
seatmap:
  enabled: false
  headless: true
  min_interval_seconds: 300      # never re-read the same screening more often
  backoff_after_block_seconds: 21600
  browser_profile_dir: "data/browser-profile"
  # browser_args: ["--ssl-version-max=tls1.2"]   # only behind a TLS-terminating proxy
  # selectors:                    # override if the site moves its markup
  #   root: "[class*=choose-seats]"
  #   seat: "[data-seat]"

# Checkout assistance. Never buys anything, never solves a human check.
#
#   open  — hand the deep link to your real desktop browser (default, reliable)
#   drive — additionally steer a Playwright browser using your own profile to the
#           seat picker and pre-select matching seats (best-effort; may be blocked)
assist:
  enabled: false
  mode: open
  stop_before_payment: true
  browser:
    headless: false
    browser_profile_dir: "data/browser-profile"

sources:
  cinemacity_cz:
    adapter: cinemacity
    base_url: "https://www.cinemacity.cz"
    options:
      locale: "cz"
      lang: "cs_CZ"
      tenant_id: 10101         # set null to re-derive from the site's JS bundle at startup
      cinemas: ["1052"]        # 1052 = Praha Flora (has the IMAX VOLVO 70mm screen)
      days_ahead: 60

profiles:
  flora_imax:
    venue: "Praha Flora"
    auditorium_regex: "(?i)imax"
    rows: [8, 14]
    seat_range: [10, 20]
    avoid_rows: [1, 2, 3]

watches:
  - name: "Odyssea IMAX 70mm"
    source: cinemacity_cz
    match:
      title_regex: "(?i)odyss"
      formats: [FILM_70MM]
      auditorium_regex: "(?i)imax"
      cinemas: ["1052"]
      date_from: 2026-08-01
      date_to: 2026-09-30
      time_between: ["16:00", "23:00"]
    seats:
      profile: flora_imax
      min_contiguous: 2
    trigger:
      on: [NEW_SCREENING, SEAT_FREED, AVAILABILITY_RISE]
      availability_rise_min: 0.005
    notify: [discord]
    cooldown: 10m
    assist: off

  # Catch-all: tell me the moment *any* new 70mm screening is published at Flora,
  # regardless of film. This is the rule that would have caught the early release.
  - name: "Any new 70mm at Flora"
    source: cinemacity_cz
    match:
      formats: [FILM_70MM]
      cinemas: ["1052"]
    trigger:
      on: [NEW_SCREENING]
    notify: [discord]
    cooldown: 1h
