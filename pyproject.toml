[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-grabber"
version = "0.1.0"
description = "Self-hosted monitor for ticketing sites: detects new screenings and seat availability, alerts instantly."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
agent = ["anthropic>=0.34"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
tg = "tg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tg"]
artifacts = ["src/tg/web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
